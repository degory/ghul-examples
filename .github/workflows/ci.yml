name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Build
      run: dotnet build

    - name: Run Integration Tests
      run: dotnet ghul-test --use-dotnet-build integration-tests

  code_review:
    name: Code review
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: degory/ghul-code-review/.github/workflows/review.yml@v2
    with:
      model: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
      idle-timeout-seconds: ${{ fromJSON(vars.CLAUDE_REVIEW_IDLE_TIMEOUT_SECONDS || '90') }}
      max-attempts: ${{ fromJSON(vars.CLAUDE_REVIEW_MAX_ATTEMPTS || '3') }}
      gh-app-id: ${{ vars.GHUL_REVIEWER_APP_ID }}
      ghul-reference: true
      prompt: |
        Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

        You run in parallel with CI. Whether the diff builds and passes the integration tests is gated by CI before merge — that's not your job. Trust the diff as written.

        First fetch the style guide, which is authoritative for terminology, prose, and code comments here:

            gh api repos/degory/ghul-style/contents/STYLE.md -H "Accept: application/vnd.github.raw" > STYLE.md

        Then read these files, in order:
        1. .github/claude-review.md — how to operate, severity bar, what to flag
        2. STYLE.md — terminology, prose, and code-comment rules
        3. GHUL.md — ghūl language reference

        Post findings only to GitHub per the brief. Do not put review text in chat messages.
    secrets:
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      gh-app-private-key: ${{ secrets.GHUL_REVIEWER_PRIVATE_KEY }}
